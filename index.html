/* =================================

function setStatus(

/* =================================
   PEER
   ================================= */

function createPeer() {

    if (pc) {
        pc.close();
    }


    pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    pc.onconnectionstatechange =
        () => {

        console.log(
            "connection:",
            pc.connectionState
        );


        if (
            pc.connectionState ===
            "connected"
        ) {

            connectedUI();

        } else {

            setStatus(
                pc.connectionState
            );

        }

    };


    pc.ondatachannel =
        event => {

        setupChannel(
            event.channel
        );

    };

}


/* =================================
   CONNECTED UI
   ================================= */

function connectedUI() {

    setStatus(

    );

}


/* =================================
   DATA CHANNEL
   ================================= */

function setupChannel(ch) {

    channel = ch;


    channel.onopen =
        () => {

        connectedUI();

    };


    channel.onclose =
        () => {

        setStatus(
            "● offline"
        );

        log(

    channel.onerror =
        error => {

    channel.onmessage =

            "peer"
        );

    };

}


/* =================================
   ICE
   ================================= */

function waitForICE() {

    return new Promise(
        resolve => {

        if (
            pc.iceGatheringState ===
            "complete"
        ) {

            resolve();

            return;
        }


        const handler = () => {

            if (
                pc.iceGatheringState ===
                "complete"
            ) {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    handler
                );

                resolve();

            }

        };


        pc.addEventListener(
            "icegatheringstatechange",
            handler
        );

    });

}

/* =================================
   COMPRESS
   ================================= */

async function compress(text) {

    if (
        !("CompressionStream" in window)
    ) {

        throw new Error(
            "CompressionStream не поддерживается"
        );

    }


    const encoder =
        new TextEncoder();


    const input =
        encoder.encode(text);


    const stream =
        new Blob([
            input
        ])
        .stream()
        .pipeThrough(
            new CompressionStream(
                "deflate"
            )
        );


    const buffer =
        await new Response(
            stream
        ).arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/* =================================
   DECOMPRESS
   ================================= */

async function decompress(bytes) {

    if (
        !("DecompressionStream" in window)
    ) {

        throw new Error(
            "DecompressionStream не поддерживается"
        );

    }


    const stream =
        new Blob([
            bytes
        ])
        .stream()
        .pipeThrough(
            new DecompressionStream(
                "deflate"
            )
        );


    const buffer =
        await new Response(
            stream
        ).arrayBuffer();


    return new TextDecoder()
        .decode(buffer);

}


/* =================================
   BASE64
   ================================= */

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunk =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunk
    ) {

        binary += String.fromCharCode(
            ...bytes.subarray(
                i,
                i + chunk
            )
        );

    }


    return btoa(binary)

        .replace(
            /\+/g,
            "-"
        )

        .replace(
            /\//g,
            "_"
        )

        .replace(
            /=+$/,
            ""
        );

}


/* =================================
   BASE64 → BYTES
   ================================= */

function base64UrlToBytes(text) {

    let base64 =
        text
            .replace(
                /-/g,
                "+"
            )
            .replace(
                /_/g,
                "/"
            );


    while (
        base64.length % 4
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/* =================================
   CREATE QR URL
   ================================= */

async function createQRUrl() {

    const text =
        signal.value.trim();


    if (!text) {

        throw new Error(
            "Нет Offer / Answer"
        );

    }


    const compressed =
        await compress(text);


    const encoded =
        bytesToBase64Url(
            compressed
        );


    /*
     * Получаем:
     *
     * https://site/#p2p=P2P1:...
     */

    const separator =
        SITE_URL.includes("#")
        ? "&"
        : "#";


    return (
        SITE_URL +
        separator +
        "p2p=P2P1:" +
        encoded
    );

}

/* =================================
   DECODE P2P DATA
   ================================= */

async function decodeP2PData(value) {

    value =
        value.trim();


    /*
     * Поддерживаем:
     *
     * https://site/#p2p=P2P1:...
     *
     * P2P1:...
     */

    let payload =
        value;


    try {

        if (
            value.startsWith(
                "http://"
            ) ||
            value.startsWith(
                "https://"
            )
        ) {

            const url =
                new URL(value);


            const param =
                url.hash
                    .replace(
                        /^#/,
                        ""
                    );


            const params =
                new URLSearchParams(
                    param
                );


            payload =
                params.get(
                    "p2p"
                );

        }

    } catch {
        // Это не URL.
    }


    if (
        !payload ||
        !payload.startsWith(
            "P2P1:"
        )
    ) {

        throw new Error(
            "Это не QR нашего P2P"
        );

    }


    const encoded =
        payload.substring(
            5
        );


    const bytes =
        base64UrlToBytes(
            encoded
        );


    const text =
        await decompress(
            bytes
        );


    const data =
        JSON.parse(text);


    if (
        data.type !== "offer" &&
        data.type !== "answer"
    ) {

        throw new Error(
            "Неизвестный тип WebRTC данных"
        );

    }


    return data;

}

                data
            );


        /*
         * Если это Offer —
         * сразу создаём Peer и предлагаем
         * сделать Answer.
         */

        if (
            data.type ===
            "offer"
        ) {

            createPeer();


            await pc.setRemoteDescription(
                data
            );


            setStatus(
                "offer received"
            );


            alert(
                "Offer получен.\n\n" +
                "Нажми «Answer»."
            );

        }


        /*
         * Если это Answer —
         * применяем его к существующему
         * Peer.
         */

        if (
            data.type ===
            "answer"
        ) {

            if (!pc) {

                throw new Error(
                    "Нет созданного Offer"
                );

            }


            await pc.setRemoteDescription(
                data
            );


            setStatus(
                "connecting..."
            );

        }


    } catch (error) {

        console.error(error);

        scanStatus.textContent =
            error.message;

    }

}


/* =================================
   SCANNER
   ================================= */

scan.onclick =
    async () => {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            alert(
                "Камера недоступна.\n" +
                "Открой сайт через HTTPS."
            );

            return;
        }


        scannerModal.classList.add(
            "show"
        );


        scanStatus.textContent =
            "Запрашиваю камеру...";


        scannerStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        }

                    },

                    audio: false

                });


        video.srcObject =
            scannerStream;


        await video.play();


        scanStatus.textContent =
            "Наведи камеру на QR";


        startScanner();


    } catch (error) {

        console.error(error);

        scannerModal.classList.remove(
            "show"
        );


        alert(
            "Не удалось открыть камеру:\n" +
            error.message
        );

    }

};


/* =================================
   SCANNER LOOP
   ================================= */

function startScanner() {

    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    function scanFrame() {

        if (
            !scannerStream ||
            video.readyState <
            HTMLMediaElement.HAVE_ENOUGH_DATA
        ) {

            scannerTimer =
                requestAnimationFrame(
                    scanFrame
                );

            return;
        }


        const width =
            video.videoWidth;


        const height =
            video.videoHeight;


        if (!width || !height) {

            scannerTimer =
                requestAnimationFrame(
                    scanFrame
                );

            return;
        }


        canvas.width =
            width;

        canvas.height =
            height;


        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        const image =
            context.getImageData(
                0,
                0,
                width,
                height
            );


        const result =
            jsQR(
                image.data,
                image.width,
                image.height,
                {
                    inversionAttempts:
                        "attemptBoth"
                }
            );


        if (result) {

            handleScannedData(
                result.data
            );

            return;

        }


        scannerTimer =
            requestAnimationFrame(
                scanFrame
            );

    }


    scanFrame();

}


/* =================================
   STOP SCANNER
   ================================= */

function stopScanner() {

    if (
        scannerTimer
    ) {

        cancelAnimationFrame(
            scannerTimer
        );

        scannerTimer =
            null;
    }


    if (
        scannerStream
    ) {

        scannerStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        scannerStream =
            null;
    }


    video.srcObject =
        null;

}


/* =================================
   CLOSE SCANNER
   ================================= */

scanClose.onclick =
    () => {

    stopScanner();

    scannerModal.classList.remove(
        "show"
    );

};


scannerModal.onclick =
    event => {

    if (
        event.target ===
        scannerModal
    ) {

        stopScanner();

        scannerModal.classList.remove(
            "show"
        );

    }

};


/* =================================
   READ P2P FROM URL
   ================================= */

async function readURLPayload() {

    const hash =
        location.hash;


    if (
        !hash
    ) {

        return;

    }


    try {

        const params =
            new URLSearchParams(
                hash.substring(1)
            );


        const payload =
            params.get(
                "p2p"
            );


        if (!payload) {
            return;
        }


        const data =
            await decodeP2PData(
                payload
            );


        signal.value =
            JSON.stringify(
                data
            );


        if (
            data.type ===
            "offer"
        ) {

            createPeer();


            await pc.setRemoteDescription(
                data
            );


            setStatus(
                "offer received"
            );


            /*
             * Убираем payload из адреса,
             * чтобы при обновлении страницы
             * не обрабатывать его снова.
             */

            history.replaceState(
                null,
                "",
                location.pathname +
                location.search
            );


            alert(
                "Offer получен.\n\n" +
                "Нажми «Answer»."
            );

        }


        if (
            data.type ===
            "answer"
        ) {

            setStatus(
                "answer received"
            );

            alert(
                "Answer получен.\n\n" +
                "Нажми «Connect»."
            );

        }


    } catch (error) {

        console.error(
            "URL P2P error:",
            error
        );

    }

}


/* =================================
   SEND MESSAGE
   ================================= */

function sendMessage() {

    const text =
        message.value.trim();


    if (!text) {
        return;
    }


    if (
        !channel ||
        channel.readyState !==
        "open"
    ) {

        return;
    }


    channel.send(
        text
    );


    log(
        "→ " + text,
        "me"
    );


    message.value =
        "";


    keepInputVisible();

}


send.onclick =
    sendMessage;


message.addEventListener(
    "keydown",
    event => {

    if (
        event.key ===
        "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

});


/* =================================
   LOG
   ================================= */

function log(
    text,
    type = "system"
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    div.textContent =
        text;


    messages.appendChild(
        div
    );


    scrollChatToBottom();

}


/* =================================
   AUTO SCROLL
   ================================= */

function scrollChatToBottom(
    smooth = true
) {

    requestAnimationFrame(
        () => {

        messages.scrollTo({

            top:
                messages.scrollHeight,

            behavior:
                smooth
                ? "smooth"
                : "auto"

        });

    });

}


/* =================================
   KEEP INPUT VISIBLE
   ================================= */

function keepInputVisible() {

    setTimeout(
        () => {

        message.scrollIntoView({

            behavior:
                "smooth",

            block:
                "end"

        });


        scrollChatToBottom();

    }, 100);

}


/* =================================
   MOBILE KEYBOARD
   ================================= */

if (
    window.visualViewport
) {

    window.visualViewport
        .addEventListener(
            "resize",
            () => {

            keepInputVisible();

        }
    );

}


/* =================================
   START
   ================================= */

readURLPayload();
