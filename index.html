<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>P2P Messenger</title>
<style>
:root{--bg:#000;--panel:#050805;--green:#00ff41;--green-dark:#008f11;--border:#123b18;--muted:#38663e;--red:#ff3030}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--green);font-family:"Courier New",monospace}body{min-height:100vh}.app{width:100%;max-width:760px;margin:auto;padding:18px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:21px;font-weight:bold;text-shadow:0 0 5px var(--green),0 0 15px var(--green)}.status{color:#777;font-size:13px}.status.connected{color:var(--green);text-shadow:0 0 8px var(--green)}
#signaling{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:hidden;max-height:600px;transition:max-height .35s ease,opacity .25s ease,padding .35s ease,margin .35s ease}#signaling.collapsed{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin:0;border:0}
.hint{color:var(--muted);font-size:12px;margin-bottom:12px}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}button{background:#020602;color:var(--green);border:1px solid var(--green-dark);border-radius:5px;padding:9px 13px;font-family:inherit;cursor:pointer;transition:.15s}button:hover{background:#062d0b;box-shadow:0 0 8px rgba(0,255,65,.35)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:default;box-shadow:none}
.signal-row{display:flex;gap:6px;align-items:stretch}textarea{width:100%;height:150px;resize:vertical;background:#000;color:var(--green);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:inherit;font-size:12px;outline:none}textarea:focus{border-color:var(--green-dark);box-shadow:0 0 8px rgba(0,255,65,.15)}.signal-row textarea{flex:1;min-width:0}.qr-button{width:48px;min-width:48px;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center}
#chat{display:none}#messages{display:flex;flex-direction:column;gap:6px;padding:8px 2px;height:calc(100dvh - 120px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--green-dark) transparent}.message{flex-shrink:0;word-break:break-word;overflow-wrap:anywhere;line-height:1.45;text-shadow:0 0 4px rgba(0,255,65,.35)}.message.me{color:var(--green)}.message.peer{color:#54ff70}.message.system{color:#286b32;font-size:12px}
.input-bar{position:fixed;left:0;right:0;bottom:0;width:100%;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,#000 70%,rgba(0,0,0,.9));display:none;z-index:100}.input-inner{width:100%;max-width:760px;margin:auto;display:flex;gap:7px}#message{flex:1;min-width:0;background:#020502;color:var(--green);border:1px solid var(--border);border-radius:5px;padding:11px;outline:none;font-family:inherit;font-size:16px}#message:focus{border-color:var(--green-dark);box-shadow:0 0 8px rgba(0,255,65,.2)}#send{min-width:45px;font-size:18px}.mobile-only{display:none}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.95);align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:100%;max-width:420px;max-height:90dvh;overflow:auto;background:#020602;border:1px solid var(--green-dark);border-radius:8px;padding:18px;text-align:center;box-shadow:0 0 30px rgba(0,255,65,.15)}.modal-title{margin-bottom:15px}#qrcode{display:inline-block;background:white;padding:10px;line-height:0;max-width:100%;overflow:auto}#qrcode img,#qrcode canvas{max-width:100%;height:auto}.modal-button{width:100%;margin-top:12px}#scannerModal video{width:100%;display:block;border:1px solid var(--green-dark);border-radius:6px;background:#000}.scanner-wrap{position:relative;width:100%}.scanner-frame{position:absolute;inset:15% 10%;border:2px solid var(--green);box-shadow:0 0 12px rgba(0,255,65,.7);pointer-events:none}.scan-status{color:var(--muted);font-size:12px;margin-top:10px;min-height:18px}
@media(max-width:700px){.mobile-only{display:inline-block}}@media(max-width:500px){.app{padding:14px 12px 80px}.logo{font-size:19px}.buttons button{flex:1;padding:9px 5px}#messages{height:calc(100dvh - 100px)}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">&gt; P2P_</div><div id="status" class="status">offline</div></header>
<div id="signaling">
  <div class="hint">Обмін Offer / Answer — передавай повний текст або QR-код</div>
  <div class="buttons">
    <button id="createOffer">Offer</button><button id="createAnswer">Answer</button><button id="connect">Connect</button>
    <button id="share" class="mobile-only">↗</button><button id="scan" class="mobile-only">📷</button>
  </div>
  <div class="signal-row"><textarea id="signal" placeholder="Offer / Answer..."></textarea><button id="qr" class="qr-button" title="Створити QR">▦</button></div>
</div>
<div id="chat"><div id="messages"></div></div>
</div>
<div id="inputBar" class="input-bar"><div class="input-inner"><input id="message" type="text" placeholder="message..." autocomplete="off" disabled><button id="send" disabled>→</button></div></div>
<div id="qrModal" class="modal"><div class="modal-box"><div class="modal-title">QR для обміну</div><div id="qrcode"></div><button id="qrClose" class="modal-button">Закрити</button></div></div>
<div id="scannerModal" class="modal"><div class="modal-box"><div class="modal-title">Сканувати QR</div><div class="scanner-wrap"><video id="video" autoplay playsinline muted></video><div class="scanner-frame"></div></div><div id="scanStatus" class="scan-status">Наведи камеру на QR</div><button id="scanClose" class="modal-button">Скасувати</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
'use strict';

// Вкажи тут точну адресу GitHub Pages без подвійного слеша в кінці.
const SITE_URL = 'https://6cnk7zcn4p-lgtm.github.io/P2P-messenger/';

let pc = null;
let channel = null;
let scannerStream = null;
let scannerFrameId = null;
let connectingUiShown = false;

const $ = id => document.getElementById(id);
const statusEl = $('status'), signaling = $('signaling'), signal = $('signal');
const createOfferBtn = $('createOffer'), createAnswerBtn = $('createAnswer'), connectBtn = $('connect');
const shareBtn = $('share'), scanBtn = $('scan'), qrBtn = $('qr');
const qrModal = $('qrModal'), qrCode = $('qrcode'), qrClose = $('qrClose');
const scannerModal = $('scannerModal'), video = $('video'), scanStatus = $('scanStatus'), scanClose = $('scanClose');
const chat = $('chat'), messages = $('messages'), inputBar = $('inputBar'), messageInput = $('message'), sendBtn = $('send');

function setStatus(text, connected = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('connected', connected);
}
function log(text, type = 'system') {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  messages.appendChild(div);
  scrollChatToBottom();
}
function scrollChatToBottom(smooth = true) {
  requestAnimationFrame(() => messages.scrollTo({top: messages.scrollHeight, behavior: smooth ? 'smooth' : 'auto'}));
}
function connectedUI() {
  if (connectingUiShown) return;
  connectingUiShown = true;
  setStatus('● online', true);
  signaling.classList.add('collapsed');
  chat.style.display = 'block';
  inputBar.style.display = 'block';
  messageInput.disabled = false;
  sendBtn.disabled = false;
  log('З’єднання встановлено', 'system');
  scrollChatToBottom(false);
}
function resetConnectedUI() {
  connectingUiShown = false;
  setStatus('● offline');
  signaling.classList.remove('collapsed');
  messageInput.disabled = true;
  sendBtn.disabled = true;
}
function setupChannel(ch) {
  channel = ch;
  channel.onopen = () => connectedUI();
  channel.onclose = () => {
    resetConnectedUI();
    log('Канал даних закрито', 'system');
  };
  channel.onerror = e => console.error('DataChannel error:', e);
  channel.onmessage = event => log('← ' + event.data, 'peer');
}
function createPeer() {
  if (pc) {
    try { pc.onconnectionstatechange = null; pc.close(); } catch (_) {}
  }
  channel = null;
  connectingUiShown = false;
  pc = new RTCPeerConnection({
    iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
  });
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    console.log('Peer connection:', pc.connectionState, 'signaling:', pc.signalingState);
    if (pc.connectionState === 'connected') connectedUI();
    else if (pc.connectionState === 'failed') setStatus('ICE failed');
    else if (pc.connectionState === 'disconnected') setStatus('disconnected');
    else if (pc.connectionState === 'closed') resetConnectedUI();
    else if (!connectingUiShown) setStatus(pc.connectionState);
  };
  pc.oniceconnectionstatechange = () => console.log('ICE:', pc.iceConnectionState);
  pc.onicegatheringstatechange = () => console.log('ICE gathering:', pc.iceGatheringState);
  pc.onsignalingstatechange = () => console.log('Signaling:', pc.signalingState);
  pc.ondatachannel = event => setupChannel(event.channel);
  return pc;
}
function waitForICE(peer, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    if (peer.iceGatheringState === 'complete') return resolve();
    let finished = false;
    const finish = (err) => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      peer.removeEventListener('icegatheringstatechange', handler);
      err ? reject(err) : resolve();
    };
    const handler = () => {
      if (peer.iceGatheringState === 'complete') finish();
    };
    const timer = setTimeout(() => finish(new Error('Тайм-аут збору ICE. Перевір інтернет і повтори спробу.')), timeoutMs);
    peer.addEventListener('icegatheringstatechange', handler);
  });
}
function parseSignal(expectedType) {
  const value = signal.value.trim();
  if (!value) throw new Error('Поле Offer / Answer порожнє.');
  const data = JSON.parse(value);
  if (!data || data.type !== expectedType || !data.sdp) throw new Error('Очікується коректний SDP типу ' + expectedType + '.');
  return data;
}

createOfferBtn.onclick = async () => {
  createOfferBtn.disabled = true;
  try {
    const peer = createPeer();
    setupChannel(peer.createDataChannel('chat'));
    setStatus('creating offer...');
    const offer = await peer.createOffer();
    await peer.setLocalDescription(offer);
    setStatus('gathering ICE...');
    await waitForICE(peer);
    signal.value = JSON.stringify(peer.localDescription);
    setStatus('offer ready');
    log('Offer створено. Передай його іншому пристрою.', 'system');
  } catch (error) {
    console.error('Offer error:', error);
    setStatus('offer error');
    alert('Не вдалося створити Offer: ' + error.message);
  } finally { createOfferBtn.disabled = false; }
};

createAnswerBtn.onclick = async () => {
  createAnswerBtn.disabled = true;
  try {
    const offer = parseSignal('offer');
    let peer = pc;
    // Якщо Offer уже встановлений (наприклад, QR-сканером), залишаємо цей Peer.
    if (!(peer && peer.signalingState === 'have-remote-offer')) {
      peer = createPeer();
      await peer.setRemoteDescription(offer);
    }
    setStatus('creating answer...');
    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    await waitForICE(peer);
    signal.value = JSON.stringify(peer.localDescription);
    setStatus('answer ready');
    log('Answer створено. Передай його назад ініціатору.', 'system');
  } catch (error) {
    console.error('Answer error:', error);
    setStatus('answer error');
    alert('Не вдалося створити Answer: ' + error.message);
  } finally { createAnswerBtn.disabled = false; }
};

connectBtn.onclick = async () => {
  connectBtn.disabled = true;
  try {
    if (!pc) throw new Error('На цьому пристрої немає активного Offer. Спочатку створи Offer на цьому ж пристрої.');
    const answer = parseSignal('answer');
    if (pc.signalingState === 'have-local-offer') {
      await pc.setRemoteDescription(answer);
    } else if (pc.signalingState === 'stable' && pc.currentRemoteDescription && pc.currentRemoteDescription.type === 'answer') {
      // Answer уже застосовано QR-сканером — не застосовуємо вдруге.
    } else {
      throw new Error('Неправильний стан: ' + pc.signalingState + '. Створи новий Offer і повтори обмін.');
    }
    setStatus('connecting...');
  } catch (error) {
    console.error('Connect error:', error);
    setStatus('connect error');
    alert('Помилка Connect: ' + error.message);
  } finally { connectBtn.disabled = false; }
};

shareBtn.onclick = async () => {
  if (!signal.value.trim()) return alert('Спочатку створи Offer або Answer.');
  if (!navigator.share) return alert('Функція системного поширення не підтримується цим браузером. Скопіюй текст вручну або створи QR.');
  try { await navigator.share({title: 'P2P Offer / Answer', text: signal.value}); }
  catch (error) { if (error.name !== 'AbortError') console.error(error); }
};

async function compressText(text) {
  if (!('CompressionStream' in window)) throw new Error('Цей браузер не підтримує стиснення для QR. Онови браузер або передай SDP текстом.');
  const stream = new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function decompressBytes(bytes) {
  if (!('DecompressionStream' in window)) throw new Error('Цей браузер не підтримує розпакування QR. Онови браузер або передай SDP текстом.');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}
function bytesToBase64Url(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(text) {
  let b64 = text.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function createQRUrl() {
  const text = signal.value.trim();
  if (!text) throw new Error('Немає Offer / Answer для QR.');
  const encoded = bytesToBase64Url(await compressText(text));
  const base = SITE_URL.replace(/\/+$/, '') + '/';
  return base + '#p2p=P2P1:' + encoded;
}
qrBtn.onclick = async () => {
  try {
    if (typeof qrcode !== 'function') throw new Error('QR-бібліотека не завантажилась. Перевір інтернет або блокувальник скриптів.');
    setStatus('creating QR...');
    const url = await createQRUrl();
    qrCode.replaceChildren();
    const code = qrcode(0, 'L');
    code.addData(url);
    code.make();
    qrCode.innerHTML = code.createImgTag(4, 8);
    qrModal.classList.add('show');
    setStatus('QR ready');
  } catch (error) {
    console.error('QR error:', error);
    alert('Не вдалося створити QR: ' + error.message);
    setStatus('QR error');
  }
};
qrClose.onclick = () => qrModal.classList.remove('show');

async function decodeP2PData(value) {
  value = value.trim();
  let payload = value;
  if (/^https?:\/\//i.test(value)) {
    const url = new URL(value);
    const hash = url.hash.replace(/^#/, '');
    payload = new URLSearchParams(hash).get('p2p');
  }
  if (!payload || !payload.startsWith('P2P1:')) throw new Error('Це не QR нашого P2P-месенджера.');
  const decoded = await decompressBytes(base64UrlToBytes(payload.slice(5)));
  const data = JSON.parse(decoded);
  if (!['offer', 'answer'].includes(data.type) || !data.sdp) throw new Error('У QR немає коректного Offer / Answer.');
  return data;
}
async function handleScannedData(value) {
  try {
    scanStatus.textContent = 'QR знайдено. Обробляю...';
    const data = await decodeP2PData(value);
    stopScanner();
    scannerModal.classList.remove('show');
    signal.value = JSON.stringify(data);
    if (data.type === 'offer') {
      // Застосовуємо Offer один раз; кнопка Answer повторно Peer не створить.
      const peer = createPeer();
      await peer.setRemoteDescription(data);
      setStatus('offer received');
      alert('Offer отримано. Натисни Answer, потім передай створений Answer назад.');
    } else {
      if (!pc) throw new Error('На цьому пристрої немає локального Offer. Створи Offer на цьому пристрої перед скануванням Answer.');
      if (pc.signalingState === 'have-local-offer') {
        await pc.setRemoteDescription(data);
      } else if (!(pc.signalingState === 'stable' && pc.currentRemoteDescription && pc.currentRemoteDescription.type === 'answer')) {
        throw new Error('Answer отримано, але стан Peer неправильний: ' + pc.signalingState + '. Створи новий Offer і повтори.');
      }
      setStatus('connecting...');
    }
  } catch (error) {
    console.error('Scanned QR error:', error);
    scanStatus.textContent = error.message;
    alert('Не вдалося обробити QR: ' + error.message);
  }
}
scanBtn.onclick = async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Камера недоступна. Відкрий сайт через HTTPS.');
    if (typeof jsQR !== 'function') throw new Error('Сканер QR не завантажився. Перевір інтернет або блокувальник скриптів.');
    scannerModal.classList.add('show');
    scanStatus.textContent = 'Запитую доступ до камери...';
    scannerStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false});
    video.srcObject = scannerStream;
    await video.play();
    scanStatus.textContent = 'Наведи камеру на QR';
    startScanner();
  } catch (error) {
    console.error('Camera error:', error);
    stopScanner();
    scannerModal.classList.remove('show');
    alert('Не вдалося відкрити камеру: ' + error.message);
  }
};
function startScanner() {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d', {willReadFrequently: true});
  const scanFrame = () => {
    if (!scannerStream) return;
    if (video.readyState < HTMLMediaElement.HAVE_ENOUGH_DATA || !video.videoWidth || !video.videoHeight) {
      scannerFrameId = requestAnimationFrame(scanFrame); return;
    }
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
    const result = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts: 'attemptBoth'});
    if (result) { handleScannedData(result.data); return; }
    scannerFrameId = requestAnimationFrame(scanFrame);
  };
  scanFrame();
}
function stopScanner() {
  if (scannerFrameId !== null) { cancelAnimationFrame(scannerFrameId); scannerFrameId = null; }
  if (scannerStream) { scannerStream.getTracks().forEach(track => track.stop()); scannerStream = null; }
  video.srcObject = null;
}
scanClose.onclick = () => { stopScanner(); scannerModal.classList.remove('show'); };
scannerModal.onclick = event => { if (event.target === scannerModal) { stopScanner(); scannerModal.classList.remove('show'); } };

async function readURLPayload() {
  if (!location.hash) return;
  try {
    const params = new URLSearchParams(location.hash.slice(1));
    const payload = params.get('p2p');
    if (!payload) return;
    const data = await decodeP2PData(payload);
    signal.value = JSON.stringify(data);
    history.replaceState(null, '', location.pathname + location.search);
    if (data.type === 'offer') {
      const peer = createPeer();
      await peer.setRemoteDescription(data);
      setStatus('offer received');
      alert('Offer отримано. Натисни Answer.');
    } else {
      // Answer із URL не застосовуємо автоматично: кнопка Connect зробить це один раз.
      setStatus('answer received');
      alert('Answer отримано. Натисни Connect на пристрої, де створювався Offer.');
    }
  } catch (error) {
    console.error('URL payload error:', error);
    alert('Помилка даних у посиланні: ' + error.message);
  }
}
function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !channel || channel.readyState !== 'open') return;
  try {
    channel.send(text);
    log('→ ' + text, 'me');
    messageInput.value = '';
    messageInput.focus();
  } catch (error) { console.error('Send error:', error); alert('Не вдалося надіслати повідомлення.'); }
}
sendBtn.onclick = sendMessage;
messageInput.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); sendMessage(); } });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { if (chat.style.display === 'block') scrollChatToBottom(false); });
window.addEventListener('beforeunload', stopScanner);
readURLPayload();
</script>
</body>
</html>
